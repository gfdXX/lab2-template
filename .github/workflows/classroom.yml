name: GitHub Classroom Workflow
on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Run unit tests
        run: |
          docker compose run --rm cars-service python -m pytest tests/ -v || true
          docker compose run --rm rental-service python -m pytest tests/ -v || true
          docker compose run --rm payment-service python -m pytest tests/ -v || true
          docker compose run --rm gateway-service python -m pytest tests/ -v || true

      - name: Clean Docker cache and volumes
        run: |
          docker system prune -f
          docker builder prune -f
          docker volume prune -f

      - name: Build images
        timeout-minutes: 15
        run: docker compose build --no-cache

      - name: Run containers
        timeout-minutes: 10
        run: |
          docker compose down -v
          docker compose up -d
          chmod +x ./scripts/wait-script.sh
          chmod +x ./scripts/wait-for.sh
          ./scripts/wait-script.sh
          # Additional wait for database initialization
          sleep 10
          # Show container logs for debugging
          echo "=== Container Status ==="
          docker compose ps
          echo "=== Gateway Service Logs ==="
          docker compose logs gateway-service --tail=20
          echo "=== Cars Service Logs ==="
          docker compose logs cars-service --tail=20
          echo "=== Rental Service Logs ==="
          docker compose logs rental-service --tail=20
           echo "=== PostgreSQL Logs ==="
           docker logs postgres --tail=50
           echo "=== Database Check ==="
           docker exec postgres psql -U program -d postgres -c "SELECT datname FROM pg_database;" || echo "Database list failed"
           docker exec postgres psql -U program -d cars -c "SELECT COUNT(*) FROM cars;" || echo "Cars DB check failed"
           docker exec postgres psql -U program -d rentals -c "SELECT COUNT(*) FROM rental;" || echo "Rentals DB check failed"
           docker exec postgres psql -U program -d payments -c "SELECT COUNT(*) FROM payment;" || echo "Payments DB check failed"
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          # TODO insert your variant
          collection: v3/postman/collection.json
          environment: v3/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 2
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v