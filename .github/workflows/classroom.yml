name: GitHub Classroom Workflow
on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Start database for tests
        run: |
          docker compose up -d postgres
          sleep 10  # Wait for database to be ready

      - name: Run unit tests
        run: |
          docker compose run --rm cars-service python -m pytest tests/ -v
          docker compose run --rm rental-service python -m pytest tests/ -v
          docker compose run --rm payment-service python -m pytest tests/ -v
          docker compose run --rm gateway-service python -m pytest tests/ -v

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          chmod +x ./scripts/wait-script.sh
          chmod +x ./scripts/wait-for.sh
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          # TODO insert your variant
          collection: v3/postman/collection.json
          environment: v3/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 2
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [build-and-deploy, api-tests, autograding]
    if: always()
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Stop containers
        continue-on-error: true
        run: docker compose down -v