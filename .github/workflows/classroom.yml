name: GitHub Classroom Workflow
on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Run unit tests
        run: |
          docker compose run --rm cars-service python -m pytest services/cars_service/tests/ -v || true
          docker compose run --rm rental-service python -m pytest services/rental_service/tests/ -v || true
          docker compose run --rm payment-service python -m pytest services/payment_service/tests/ -v || true
          docker compose run --rm gateway-service python -m pytest services/gateway_service/tests/ -v || true

  integration-tests:
    name: Integration Tests & Autograding
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Clean Docker cache and volumes
        run: |
          docker system prune -f
          docker builder prune -f
          docker volume prune -f

      - name: Build images
        timeout-minutes: 15
        run: docker compose build --no-cache

      - name: Run containers
        timeout-minutes: 10
        run: |
          docker compose down -v
          docker compose up -d
          chmod +x ./scripts/wait-script.sh
          chmod +x ./scripts/wait-for.sh
          ./scripts/wait-script.sh
          sleep 10
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v3/postman/collection.json
          environment: v3/postman/environment.json
          delayRequest: 100
          args: --reporters cli,json --reporter-json-export newman-report.json
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v