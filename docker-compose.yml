version: "3"
services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"

  cars-service:
    build: ./services/cars_service
    container_name: cars-service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://program:test@postgres:5432/cars
    ports:
      - "8070:8070"
    depends_on:
      - postgres

  rental-service:
    build: ./services/rental_service
    container_name: rental-service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://program:test@postgres:5432/rentals
    ports:
      - "8060:8060"
    depends_on:
      - postgres
      - cars-service

  payment-service:
    build: ./services/payment_service
    container_name: payment-service
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://program:test@postgres:5432/payments
    ports:
      - "8050:8050"
    depends_on:
      - postgres

  gateway-service:
    build: ./services/gateway_service
    container_name: gateway-service
    restart: on-failure
    environment:
      CARS_SERVICE_URL: http://cars-service:8070
      RENTAL_SERVICE_URL: http://rental-service:8060
      PAYMENT_SERVICE_URL: http://payment-service:8050
    ports:
      - "8080:8080"
    depends_on:
      - cars-service
      - rental-service
      - payment-service

volumes:
  db-data: